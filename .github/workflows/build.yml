name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fetch ffmpeg (for integration tests)
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Restore
        run: dotnet restore FormatConverter.slnx -p:NuGetAudit=false

      - name: Build
        run: dotnet build FormatConverter.slnx -c Release --no-restore

      - name: Test
        run: dotnet test FormatConverter.slnx -c Release --no-build
